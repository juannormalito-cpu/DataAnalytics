services:
  app:
    build:
      context: ../../
      dockerfile: projects/fintech_fraud_intelligence/Dockerfile
      args:
        PROJECT_PATH: projects/fintech_fraud_intelligence
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fintech_fraud_intelligence
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
