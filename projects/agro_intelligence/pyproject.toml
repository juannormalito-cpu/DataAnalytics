[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agro_intelligence"
version = "0.1.0"
description = "Inteligencia de datos agropecuaria para Buenos Aires, Santa Fe, Entre Ríos, Corrientes y Córdoba: ganadería, agricultura y forestación."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Facu" }
]
dependencies = [
    "pandas",
    "numpy",
    "SQLAlchemy",
    "psycopg2-binary",
    "python-dotenv",
    "requests",
    "numpy-financial",
    "streamlit",
    "plotly",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["src"]
